<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面 B · 组件演示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a class="brand" href="index.html">hhh<span>.</span></a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="a.html">页面 A</a>
    <a href="b.html" class="active">页面 B</a>
    <a href="c.html">页面 C</a>
  </div>
</nav>

<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Page B</span>
    <h1>组件演示</h1>
    <p class="lede">几个轻量交互组件的演示，纯原生 JS，无依赖。</p>
  </header>

  <section class="section">
    <div class="sec-head"><span class="sec-num">01</span><h2>计数器</h2></div>
    <div class="demo-box" style="text-align:center">
      <div class="counter" id="cnt">0</div>
      <button class="btn btn-primary" onclick="add()">+1</button>
      <button class="btn btn-ghost" onclick="resetCnt()">重置</button>
    </div>
  </section>

  <section class="section">
    <div class="sec-head"><span class="sec-num">02</span><h2>标签页</h2></div>
    <div class="demo-box">
      <div class="tabs">
        <button class="tab active" onclick="switchTab(this,'t1')">标签一</button>
        <button class="tab" onclick="switchTab(this,'t2')">标签二</button>
        <button class="tab" onclick="switchTab(this,'t3')">标签三</button>
      </div>
      <div class="tab-panel active" id="t1"><div class="card" style="display:block">这是标签一的内容：场景决定动机强弱。</div></div>
      <div class="tab-panel" id="t2"><div class="card" style="display:block">这是标签二的内容：场景决定能力够不够。</div></div>
      <div class="tab-panel" id="t3"><div class="card" style="display:block">这是标签三的内容：场景决定提示能否出现。</div></div>
    </div>
  </section>

  <footer>hhh Demo · <a href="index.html">返回首页</a></footer>
</div>

<script>
  let n = 0;
  function add(){ n++; document.getElementById('cnt').textContent = n; }
  function resetCnt(){ n = 0; document.getElementById('cnt').textContent = 0; }
  function switchTab(el, id){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
